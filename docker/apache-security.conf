# Fallas Exitosas · Endurecimiento de Apache y política de caché de activos.
# Autor : William Valverde V.
# Fecha : 2026-09-20
# Bitácora : 2026-09-20 — se agrega font-src para la tipografía autoalojada, se evita
#            duplicar los encabezados que ya emite PHP y se fija caché de marca.
#            2026-09-20 — Apache centraliza cabeceras y agrega HSTS solo sobre HTTPS.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html/public">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule mod_headers.c>
    # Fuente única para PHP, estáticos, redirecciones y errores de Apache.
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=()"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    <If "%{HTTPS} == 'on'">
        Header always set Strict-Transport-Security "max-age=31536000"
    </If>
</IfModule>

# La tipografía y el logotipo institucional no cambian entre despliegues de contenido.
<IfModule mod_headers.c>
    <LocationMatch "^/assets/(fonts|logos)/">
        Header always set Cache-Control "public, max-age=2592000"
    </LocationMatch>
</IfModule>
