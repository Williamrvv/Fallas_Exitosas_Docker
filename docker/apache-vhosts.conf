# Fallas Exitosas · Virtual hosts HTTP/HTTPS.
# Propósito : redirige todo HTTP al origen HTTPS configurado y sirve la aplicación solo mediante TLS.
# Autor     : William Valverde V.
# Fecha     : 2026-09-20
# Bitácora  : 2026-09-25 El access log omite query strings y códigos OAuth.

ServerName localhost

# `%r` y `%q` registrarían el código de autorización y state del callback.
# Esta variante conserva método/ruta/estado sin parámetros sensibles.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" anc_safe

<VirtualHost *:80>
    ServerName localhost

    RewriteEngine On
    RewriteRule ^ ${APP_PUBLIC_ORIGIN}%{REQUEST_URI} [R=308,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log anc_safe
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName localhost
        DocumentRoot ${APACHE_DOCUMENT_ROOT}

        SSLEngine on
        SSLCertificateFile ${TLS_CERTIFICATE_PATH}
        SSLCertificateKeyFile ${TLS_PRIVATE_KEY_PATH}
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCompression off
        SSLSessionTickets off

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log anc_safe
    </VirtualHost>
</IfModule>
